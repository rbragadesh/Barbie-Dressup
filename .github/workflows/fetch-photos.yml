name: Fetch landmark photos

# Run by hand from the Actions tab. Wikimedia rate-limits busy shared cloud addresses,
# so the candidate photos are fetched here and uploaded as an artifact to choose from
# (see scripts/fetch-photos.py).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch-photos.py photos-raw
      - uses: actions/upload-artifact@v4
        with:
          name: photos-raw
          path: photos-raw
          retention-days: 7
